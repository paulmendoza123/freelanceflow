<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceFlow — Projects</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">
    <aside class="sidebar">
        <div class="sidebar-logo">Freelance<span class="accent">Flow</span></div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard
            </a>
            <a href="clients.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients
            </a>
            <a href="projects.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects
            </a>
            <a href="invoices.html" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Invoices
            </a>
            <a href="timelogs.html" class="nav-item">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Time Logs
            </a>
        </nav>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout
        </button>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Projects</h1>
                <p class="page-sub">Track all your freelance projects</p>
            </div>
            <button class="btn-primary btn-add" onclick="openModal()">+ Add Project</button>
        </div>

        <!-- FILTER TABS -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterByStatus('all', this)">All</button>
            <button class="filter-tab" onclick="filterByStatus('active', this)">Active</button>
            <button class="filter-tab" onclick="filterByStatus('paused', this)">Paused</button>
            <button class="filter-tab" onclick="filterByStatus('done', this)">Done</button>
        </div>

        <div class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Project</th>
                        <th>Client</th>
                        <th>Budget</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="projectsTable">
                    <tr><td colspan="6" class="loading">Loading projects...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Project</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="projectForm" onsubmit="submitProject(event)">
                <div class="form-group">
                    <label>Project Title *</label>
                    <input type="text" id="projTitle" placeholder="Website Redesign" required>
                </div>
                <div class="form-group">
                    <label>Client *</label>
                    <select id="projClient" required>
                        <option value="">Select a client...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="projDesc" placeholder="Project description..." rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Budget (₱) *</label>
                        <input type="number" id="projBudget" placeholder="15000" required>
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="projDeadline">
                    </div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="projStatus">
                        <option value="active">Active</option>
                        <option value="paused">Paused</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitBtn">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!getToken()) window.location.href = 'index.html';

        let allProjects = [];
        let allClients  = [];
        let editingId   = null;
        let currentFilter = 'all';

        async function loadData() {
            [allProjects, allClients] = await Promise.all([getProjects(), getClients()]);
            populateClientSelect();
            renderTable(allProjects);
        }

        function populateClientSelect() {
            const sel = document.getElementById('projClient');
            allClients.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                sel.appendChild(opt);
            });
        }

        function getClientName(id) {
            const c = allClients.find(c => c.id === id);
            return c ? c.name : '—';
        }

        function renderTable(projects) {
            const tbody = document.getElementById('projectsTable');
            if (!projects.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">No projects found.</td></tr>';
                return;
            }
            const statusMap = { active: 'green', paused: 'amber', done: 'blue' };
            tbody.innerHTML = projects.map(p => `
                <tr>
                    <td><strong>${p.title}</strong><br><small style="color:#6b7280">${p.description || ''}</small></td>
                    <td>${getClientName(p.client)}</td>
                    <td>₱${parseFloat(p.budget).toLocaleString()}</td>
                    <td>${p.deadline || '—'}</td>
                    <td><span class="badge badge-${statusMap[p.status]}">${p.status}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editProject(${p.id})">Edit</button>
                            <button class="btn-delete" onclick="confirmDelete(${p.id}, '${p.title}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterByStatus(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = status === 'all' ? allProjects : allProjects.filter(p => p.status === status);
            renderTable(filtered);
        }

        function openModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add New Project';
            document.getElementById('submitBtn').textContent  = 'Save Project';
            document.getElementById('projectForm').reset();
            document.getElementById('modal').style.display = 'flex';
        }

        function editProject(id) {
            const p = allProjects.find(p => p.id === id);
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Project';
            document.getElementById('submitBtn').textContent  = 'Update Project';
            document.getElementById('projTitle').value    = p.title;
            document.getElementById('projClient').value   = p.client;
            document.getElementById('projDesc').value     = p.description || '';
            document.getElementById('projBudget').value   = p.budget;
            document.getElementById('projDeadline').value = p.deadline || '';
            document.getElementById('projStatus').value   = p.status;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeModalOutside(e) { if (e.target.id === 'modal') closeModal(); }

        async function submitProject(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Saving...';

            const data = {
                title:       document.getElementById('projTitle').value,
                client:      document.getElementById('projClient').value,
                description: document.getElementById('projDesc').value,
                budget:      document.getElementById('projBudget').value,
                deadline:    document.getElementById('projDeadline').value || null,
                status:      document.getElementById('projStatus').value,
            };

            editingId ? await updateProject(editingId, data) : await createProject(data);
            closeModal();
            await loadData();
            btn.disabled = false;
        }

        async function confirmDelete(id, title) {
            if (confirm(`Delete "${title}"?`)) {
                await deleteProject(id);
                await loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
