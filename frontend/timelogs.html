<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceFlow — Time Logs</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">
    <aside class="sidebar">
        <div class="sidebar-logo">Freelance<span class="accent">Flow</span></div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard
            </a>
            <a href="clients.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients
            </a>
            <a href="projects.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects
            </a>
            <a href="invoices.html" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Invoices
            </a>
            <a href="timelogs.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Time Logs
            </a>
        </nav>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout
        </button>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Time Logs</h1>
                <p class="page-sub">Track hours worked per project</p>
            </div>
            <button class="btn-primary btn-add" onclick="openModal()">+ Log Time</button>
        </div>

        <!-- TOTAL HOURS CARD -->
        <div class="stats-grid" style="grid-template-columns: repeat(3,1fr); margin-bottom:20px;">
            <div class="stat-card">
                <div class="stat-icon green">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="totalHours">—</div>
                    <div class="stat-label">Total Hours Logged</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="totalEntries">—</div>
                    <div class="stat-label">Total Entries</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon amber">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="avgHours">—</div>
                    <div class="stat-label">Avg Hours/Entry</div>
                </div>
            </div>
        </div>

        <div class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Project</th>
                        <th>Description</th>
                        <th>Hours</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="timelogsTable">
                    <tr><td colspan="5" class="loading">Loading time logs...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal">
            <div class="modal-header">
                <h3>Log Time</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="timelogForm" onsubmit="submitTimelog(event)">
                <div class="form-group">
                    <label>Project *</label>
                    <select id="logProject" required>
                        <option value="">Select project...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <input type="text" id="logDesc" placeholder="What did you work on?" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Hours *</label>
                        <input type="number" id="logHours" placeholder="2.5" step="0.5" min="0.5" required>
                    </div>
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="logDate" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitBtn">Save Log</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!getToken()) window.location.href = 'index.html';

        let allLogs     = [];
        let allProjects = [];

        async function loadData() {
            [allLogs, allProjects] = await Promise.all([getTimeLogs(), getProjects()]);
            populateProjectSelect();
            renderTable();
            updateStats();
        }

        function populateProjectSelect() {
            const sel = document.getElementById('logProject');
            allProjects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.title;
                sel.appendChild(opt);
            });
        }

        function getProjectName(id) {
            const p = allProjects.find(p => p.id === id);
            return p ? p.title : '—';
        }

        function updateStats() {
            const total = allLogs.reduce((s, l) => s + parseFloat(l.hours), 0);
            document.getElementById('totalHours').textContent   = total.toFixed(1) + 'h';
            document.getElementById('totalEntries').textContent = allLogs.length;
            document.getElementById('avgHours').textContent     = allLogs.length ? (total / allLogs.length).toFixed(1) + 'h' : '0h';
        }

        function renderTable() {
            const tbody = document.getElementById('timelogsTable');
            if (!allLogs.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">No time logs yet. Start tracking!</td></tr>';
                return;
            }
            tbody.innerHTML = allLogs.map(l => `
                <tr>
                    <td>${l.date}</td>
                    <td><span class="badge badge-blue">${getProjectName(l.project)}</span></td>
                    <td>${l.description}</td>
                    <td><strong>${l.hours}h</strong></td>
                    <td>
                        <button class="btn-delete" onclick="confirmDelete(${l.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal() {
            document.getElementById('timelogForm').reset();
            // Set today's date by default
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeModalOutside(e) { if (e.target.id === 'modal') closeModal(); }

        async function submitTimelog(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Saving...';
            const data = {
                project:     document.getElementById('logProject').value,
                description: document.getElementById('logDesc').value,
                hours:       document.getElementById('logHours').value,
                date:        document.getElementById('logDate').value,
            };
            await createTimeLog(data);
            closeModal();
            await loadData();
            btn.disabled = false;
        }

        async function confirmDelete(id) {
            if (confirm('Delete this time log?')) {
                await deleteTimeLog(id);
                await loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
