<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceFlow — Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-text">Freelance<span class="accent">Flow</span></span>
        </div>
        <p class="auth-subtitle">Manage your freelance business</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <p id="errorMsg" class="error-msg"></p>
            <button type="submit" class="btn-primary" id="loginBtn">Login</button>
            <!-- Add this AFTER the login button -->
            <div class="auth-links">
                <a href="forgot-password.html">Forgot Password?</a>
                <span>·</span>
                <a href="register.html">Create Account</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (getToken()) window.location.href = 'dashboard.html';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const data = await login(username, password);

            if (data.access) {
                saveToken(data.access);
                localStorage.setItem('refresh_token', data.refresh);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').textContent = 'Invalid username or password!';
                btn.textContent = 'Login';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
